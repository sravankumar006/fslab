<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit 2: JS DOM & Validation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f5; }
    .card { background: white; padding: 20px; border-radius: 6px; max-width: 650px; margin: auto; }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error-msg { color: #dc3545; font-size: 14px; margin-bottom: 10px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #343a40; color: white; }
    .delete-btn { background: #dc3545; padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Student Roster Management</h3>
    <div id="error" class="error-msg"></div>

    <div class="input-row">
      <input type="text" id="studentName" placeholder="Student Name">
      <input type="text" id="rollNo" placeholder="Roll No (e.g., 21A910501)">
      <button id="addBtn">Add Student</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>

  <script>
    // ES6 Class Definition
    class StudentEntry {
      constructor(rollNo, name) {
        this.rollNo = rollNo;
        this.name = name;
      }
    }

    const students = [];

    const nameInput = document.getElementById('studentName');
    const rollInput = document.getElementById('rollNo');
    const errorBox = document.getElementById('error');
    const tableBody = document.getElementById('studentTableBody');
    const addBtn = document.getElementById('addBtn');

    // Validation & DOM Insertion
    addBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const rollNo = rollInput.value.trim();

      // Form validation rules
      if (!name || !rollNo) {
        showError("All fields are required.");
        return;
      }
      if (rollNo.length < 5) {
        showError("Roll number must be at least 5 characters.");
        return;
      }

      hideError();

      // Instantiate class and save
      const newStudent = new StudentEntry(rollNo, name);
      students.push(newStudent);

      renderTable();
      nameInput.value = '';
      rollInput.value = '';
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    function renderTable() {
      tableBody.innerHTML = '';
      students.forEach((std, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${std.rollNo}</td>
          <td>${std.name}</td>
          <td><button class="delete-btn" onclick="deleteStudent(${index})">Remove</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Exposed to window for onclick handler
    window.deleteStudent = function(index) {
      students.splice(index, 1);
      renderTable();
    };
  </script>
</body>
</html>
